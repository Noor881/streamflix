<body>
    <div id="detail-app">
        <!-- Static H1 for SEO crawlers (updated by JS with show title) -->
        <h1 class="visually-hidden" id="static-h1">Watch TV Show on HD Watchzone</h1>
        <div class="detail-loading">
            <div class="loader"></div>
            <p>Loading show...</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => { });
            });
        }
    </script>
    <script src="/detail.js?v=audit13"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            let season = params.get('s');
            let episode = params.get('e');

            // If no query params, try to extract from path
            if (!id) {
                const pathMatch = window.location.pathname.match(/\/tv\/(\d+)(?:-[^/]+)?(?:\/(\d+))?(?:\/(\d+))?/);
                if (pathMatch) {
                    id = pathMatch[1];
                    season = pathMatch[2] || season;
                    episode = pathMatch[3] || episode;
                }
            }

            // Strip slug suffix — e.g. "1396-breaking-bad" → "1396"
            if (id) {
                const numericId = id.match(/^(\d+)/);
                if (numericId) id = numericId[1];
            }

            // Default values
            season = season || 1;
            episode = episode || 1;

            if (id) {
                DetailPage.loadTV(id, Math.max(1, parseInt(season, 10) || 1), Math.max(1, parseInt(episode, 10) || 1));
            } else {
                document.getElementById('detail-app').innerHTML = `
                    <div class="detail-error">
                        <h2>TV Show Not Found</h2>
                        <p>No TV show ID specified.</p>
                        <a href="/" class="btn-play">Go Home</a>
                    </div>`;
            }
        });
    </script>
