                // OG & Twitter tags
                var setMeta = function(prop, val, byName) {
                    var el = document.querySelector(byName ? 'meta[name="' + prop + '"]' : 'meta[property="' + prop + '"]');

                };

                setMeta('og:description', desc);
                setMeta('twitter:title', fullTitle, true);

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');
            let season = params.get('s');
            let episode = params.get('e');

            // If no query params, try to extract from path
            if (!id) {
                const pathMatch = window.location.pathname.match(/\/tv\/(\d+)(?:\/(\d+))?(?:\/(\d+))?/);
                if (pathMatch) {
                    id = pathMatch[1];
                    season = pathMatch[2] || season;
                    episode = pathMatch[3] || episode;
                }
            }

            // Strip slug suffix — e.g. "1396-breaking-bad" → "1396"
            if (id) {
                const numericId = id.match(/^(\d+)/);
                if (numericId) id = numericId[1];
            }

            // Default values
            season = season || 1;
            episode = episode || 1;

            if (id) {
                DetailPage.loadTV(id, parseInt(season), parseInt(episode));
            } else {
                document.getElementById('detail-app').innerHTML = `
                    <div class="detail-error">
                        <h2>TV Show Not Found</h2>
                        <p>No TV show ID specified.</p>
                        <a href="/" class="btn-play">Go Home</a>
                    </div>`;
            }
        });
    </script>
