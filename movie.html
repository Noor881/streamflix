    <!-- Primary Meta (updated by JS) -->
    <title>Watch Movie - HD Watchzone</title>
    <!-- Fast SEO Injection from URL so bots don't index identical empty states -->
    <script>
        (function () {
            var path = window.location.pathname;
            var parts = path.split('/');
            if (parts.length >= 3 && parts[1] === 'movie') {
                var idSlug = parts[2];
                var slugMatch = idSlug.match(/^\d+-(.+)$/);
                var titleStr = slugMatch
                    ? slugMatch[1].replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); })
                    : 'Watch Movie';
                var fullTitle = 'Watch ' + titleStr + ' In HD Free - HD Watchzone';
                var desc = 'Watch ' + titleStr + ' online in HD for free on HD Watchzone. No sign-up required. Stream movies instantly.';
                var canonUrl = 'https://hdwatchzone.com' + path;

                document.title = fullTitle;

                // Canonical
                var canonical = document.createElement('link');
                canonical.rel = 'canonical';
                canonical.href = canonUrl;
                document.head.appendChild(canonical);

                // OG tags
                var setMeta = function(prop, val, byName) {
                    var el = document.querySelector(byName ? 'meta[name="' + prop + '"]' : 'meta[property="' + prop + '"]');
                    if (el) el.setAttribute('content', val);
                };
                setMeta('og:url', canonUrl);
                setMeta('og:title', fullTitle);
                setMeta('og:description', desc);
                setMeta('twitter:title', fullTitle, true);
                setMeta('twitter:description', desc, true);

                // Seed schema with slug-derived data (JS will overwrite with full TMDB data)
                var schemaEl = document.getElementById('schema-movie');
                if (schemaEl) {
                    schemaEl.textContent = JSON.stringify({
                        '@context': 'https://schema.org',
                        '@type': 'Movie',
                        'name': titleStr,
                        'description': desc,
                        'url': canonUrl,
                        'embedUrl': canonUrl,
                        'potentialAction': {
                            '@type': 'WatchAction',
                            'target': canonUrl
                        }
                    });
                }
            }
        })();
    </script>

    <script src="/detail.js?v=4.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            // If no query param, try to extract from path
            if (!id) {
                const pathMatch = window.location.pathname.match(/\/movie\/(\d+)/);
                if (pathMatch) {
                    id = pathMatch[1];
                }
            }

            // Strip slug suffix — e.g. "550-fight-club" → "550"
            if (id) {
                const numericId = id.match(/^(\d+)/);
                if (numericId) id = numericId[1];
            }

            if (id) {
                DetailPage.loadMovie(id);
            } else {
                document.getElementById('detail-app').innerHTML = `
                    <div class="detail-error">
                        <h2>Movie Not Found</h2>
                        <p>No movie ID specified.</p>
                        <a href="/" class="btn-play">Go Home</a>
                    </div>`;
            }
        });
    </script>
