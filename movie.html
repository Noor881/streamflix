<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="gUv3UPUWfc-0jPQ4eosSHLGJvSnKrdCyc8x_bfResfg" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZHQKVYP1WN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-ZHQKVYP1WN');
    </script>

    <!-- Primary Meta (updated by JS) -->
    <title>Watch Movie - Streamflix</title>
    <!-- Fast SEO Injection from URL so bots don't index identical empty states -->
    <script>
        (function () {
            const path = window.location.pathname;
            const parts = path.split('/');
            if (parts.length >= 3 && parts[1] === 'movie') {
                const idSlug = parts[2];
                const slugMatch = idSlug.match(/^\d+-(.+)$/);
                if (slugMatch) {
                    let titleStr = slugMatch[1].replace(/-/g, ' ');
                    titleStr = titleStr.replace(/\b\w/g, c => c.toUpperCase());
                    document.title = "Watch " + titleStr + " In HD Free - Streamflix";
                }
            }
        })();
    </script>
    <meta name="description" content="Watch movies in HD on Streamflix. Free streaming, no sign-up required.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="language" content="English">

    <!-- Open Graph (updated by JS for social crawlers that run JS) -->
    <meta property="og:type" content="video.movie">
    <meta property="og:site_name" content="Streamflix">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="">
    <meta property="og:title" content="Watch Movie - Streamflix">
    <meta property="og:description" content="Watch movies in HD on Streamflix. Free streaming.">
    <meta property="og:image" content="https://streamflix.com/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@streamflix">
    <meta name="twitter:title" content="Watch Movie - Streamflix">
    <meta name="twitter:description" content="Watch movies in HD on Streamflix.">
    <meta name="twitter:image" content="https://streamflix.com/logo.png">

    <!-- Canonical (dynamically injected via app.js) -->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/logo.png">

    <!-- Theme -->
    <meta name="theme-color" content="#e50914">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/detail.css">
    <link rel="stylesheet" href="/seo-enhancements.css">
    <link rel="stylesheet" href="/responsive.css">

    <!-- Schema.org (injected by JS) -->
    <script id="schema-movie" type="application/ld+json">{}</script>
</head>

<body>
    <div id="detail-app">
        <!-- Static H1 for SEO crawlers (replaced by JS) -->
        <h1 style="position:absolute;left:-9999px;" id="static-h1">Watch Movie on Streamflix</h1>
        <div class="detail-loading">
            <div class="loader"></div>
            <p>Loading movie...</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => { });
            });
        }
    </script>
    <script src="/detail.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            // If no query param, try to extract from path
            if (!id) {
                const pathMatch = window.location.pathname.match(/\/movie\/(\d+)/);
                if (pathMatch) {
                    id = pathMatch[1];
                }
            }

            if (id) {
                DetailPage.loadMovie(id);
            } else {
                document.getElementById('detail-app').innerHTML = `
                    <div class="detail-error">
                        <h2>Movie Not Found</h2>
                        <p>No movie ID specified.</p>
                        <a href="/" class="btn-play">Go Home</a>
                    </div>`;
            }
        });
    </script>
    <script type="module" src="/scripts/visitor-counter.js" defer></script>
</body>

</html>
