<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — HD Watchzone</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="gUv3UPUWfc-0jPQ4eosSHLGJvSnKrdCyc8x_bfResfg" />

    <!-- Facebook Domain Verification -->
    <meta name="facebook-domain-verification" content="8bgdrm3l1z17cy9ahrb2aesr3htirg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hdwatchzone.com/">
    <meta property="og:title" content="Page Not Found - HD Watchzone">
    <meta property="og:description" content="The page you're looking for doesn't exist.">
    <meta property="og:image" content="https://hdwatchzone.com/logo-v2.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:image" content="https://hdwatchzone.com/logo-v2.png">

    <script src="/site-core.js" defer></script>

    <link rel="icon" href="/favicon-v2.ico" sizes="any">
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            padding: 20px 40px;
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
        }

        .logo-icon {
            color: #e50914;
            font-size: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-accent {
            color: #e50914;
        }

        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .error-code {
            font-size: clamp(100px, 15vw, 200px);
            font-weight: 800;
            color: #e50914;
            line-height: 1;
            letter-spacing: -8px;
            position: relative;
        }

        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            color: transparent;
            text-shadow: 0 0 60px rgba(229, 9, 20, 0.3);
        }

        .error-title {
            font-size: clamp(20px, 3vw, 32px);
            font-weight: 700;
            margin: 16px 0 12px;
            color: #fff;
        }

        .error-desc {
            font-size: 16px;
            color: #999;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #e50914;
            color: #fff;
        }

        .btn-primary:hover {
            background: #f40612;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .trending-section {
            padding: 40px 40px 60px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .trending-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .trending-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 2/3;
            background: #1a1a1a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .trending-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .trending-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .trending-card a {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            padding: 12px;
            text-decoration: none;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.85));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .trending-card:hover a {
            opacity: 1;
        }

        .trending-card-title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
        }

        .trending-card-rating {
            color: #f5c518;
            font-size: 12px;
            margin-top: 4px;
        }

        .skeleton-card {
            background: #1a1a1a;
            border-radius: 8px;
            aspect-ratio: 2/3;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .header-bar {
                padding: 16px 20px;
            }

            .trending-section {
                padding: 30px 20px 40px;
            }

            .trending-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <a href="/" class="logo">
            <img src="/logo.png" alt="HD Watchzone" class="logo-img"
                style="height: 80px; mix-blend-mode: screen; filter: invert(1);">
            <span class="logo-text">HD <span class="logo-accent">Watchzone</span></span>
        </a>
    </div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Lost in the Stream</h1>
        <p class="error-desc">
            The page you're looking for doesn't exist or may have been moved.
            But don't worry — there's plenty more to watch.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Go Home
            </a>
            <a href="/#/movies" class="btn btn-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
                Browse Movies
            </a>
        </div>
    </div>

    <div class="trending-section">
        <h2 class="trending-title">🔥 Trending Right Now</h2>
        <div class="trending-grid" id="trending-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </div>

    <script>
        const TMDB_KEY = 'd74b73cd4563f614919e6493152fbc1e';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w342';

        async function loadTrending() {
            try {
                const res = await fetch(
                    `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}`
                );
                const data = await res.json();
                const items = data.results.slice(0, 12);
                const grid = document.getElementById('trending-grid');

                grid.innerHTML = items.map(item => {
                    const title = item.title || item.name;
                    const type = item.media_type === 'movie' ? 'movie' : 'tv';
                    const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
                    const poster = item.poster_path
                        ? `${IMG_BASE}${item.poster_path}`
                        : '';

                    if (!poster) return '';

                    return `
                        <div class="trending-card">
                            <img src="${poster}" alt="${title}" loading="lazy">
                            <a href="/${type}/${item.id}">
                                <div>
                                    <div class="trending-card-title">${title}</div>
                                    ${rating ? `<div class="trending-card-rating">★ ${rating}</div>` : ''}
                                </div>
                            </a>
                        </div>
                    `;
                }).join('');
            } catch {
                document.getElementById('trending-grid').innerHTML =
                    '<p style="color:#666">Could not load trending content.</p>';
            }
        }

        loadTrending();
    </script>
</body>

</html>
