<body>
    <div id="detail-app">
        <!-- Title information is rendered here by the server, then enhanced by the client. -->
        <h1 id="static-h1">Movie Details</h1>
        <div class="detail-loading">
            <div class="loader"></div>
            <p>Loading movie...</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => { });
            });
        }
    </script>
    <script src="/detail.js?v=discover21" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('id');

            // If no query param, try to extract from path
            if (!id) {
                const pathMatch = window.location.pathname.match(/\/movie\/(\d+)/);
                if (pathMatch) {
                    id = pathMatch[1];
                }
            }

            // Strip slug suffix — e.g. "550-fight-club" → "550"
            if (id) {
                const numericId = id.match(/^(\d+)/);
                if (numericId) id = numericId[1];
            }

            if (id) {
                DetailPage.loadMovie(id);
            } else {
                document.getElementById('detail-app').innerHTML = `
                    <div class="detail-error">
                        <h2>Movie Not Found</h2>
                        <p>No movie ID specified.</p>
                        <a href="/" class="btn-play">Go Home</a>
                    </div>`;
            }
        });
    </script>
</body>
