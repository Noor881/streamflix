name: Website regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm ci
      - run: npm test
      - name: Build allowlisted public assets without upstream requests
        run: npm run build:static
      - name: Check browser and server JavaScript
        run: |
          node --check app.js
          node --check detail.js
          node --check site-core.js
          node --check sw.js
          node --check admin.js
          node --check api/render.js
          node --check server/ssr.js
          node --check seo-core.js
          node --check discovery-core.js
          node --check for-you.js
          node --check scripts/dev-server.cjs
          node --check scripts/auto-blogger.js
          node --check scripts/build.cjs
          node --check scripts/build-static.cjs
